<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- Placeholder shown for products that have no picture yet -->
  <rect width="200" height="150" fill="#e7e7e7"/>
  <rect x="1" y="1" width="198" height="148" fill="none" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- simple "picture" icon: frame, sun and mountains -->
  <rect x="70" y="35" width="60" height="45" rx="4" fill="none" stroke="#9e9e9e" stroke-width="3"/>
  <circle cx="85" cy="49" r="5" fill="#9e9e9e"/>
  <polyline points="73,77 93,58 105,69 113,62 127,77" fill="none" stroke="#9e9e9e" stroke-width="3" stroke-linejoin="round"/>
  <!-- slash = "no" -->
  <line x1="64" y1="86" x2="136" y2="30" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="14" fill="#757575" text-anchor="middle">No image</text>
  <text x="100" y="128" font-family="Arial, sans-serif" font-size="14" fill="#757575" text-anchor="middle">available</text>
</svg>
